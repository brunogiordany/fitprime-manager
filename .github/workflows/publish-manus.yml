name: Publish FitPrime on Manus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitprime-manus-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      TARGET_SITE: fitprimehub-sfh8sqab.manus.space
    steps:
      - name: Check Manus API key
        id: key
        shell: bash
        run: |
          if [ -z "$MANUS_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MANUS_API_KEY is not configured. Skipping Manus publish."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate FitPrime website in Manus
        if: steps.key.outputs.available == 'true'
        id: site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.parse, urllib.request

          key = os.environ["MANUS_API_KEY"]
          target = os.environ["TARGET_SITE"]
          cursor = None
          found = None

          for _ in range(20):
              qs = {"type": "website", "limit": "100"}
              if cursor:
                  qs["cursor"] = cursor
              url = "https://api.manus.ai/v2/artifact.list?" + urllib.parse.urlencode(qs)
              req = urllib.request.Request(url, headers={"x-manus-api-key": key})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)

              if not data.get("ok"):
                  raise SystemExit(f"artifact.list failed: {data}")

              for item in data.get("data", []):
                  if target in (item.get("url") or ""):
                      found = item
                      break

              if found or not data.get("has_more"):
                  break
              cursor = data.get("next_cursor")
              if not cursor:
                  break

          if not found:
              raise SystemExit(f"Could not find Manus website artifact for {target}")

          print("task_id=" + found["task_id"])
          print("artifact_id=" + found["id"])
          print("artifact_url=" + (found.get("url") or ""))
          PY

      - name: Inspect Manus checkpoints
        if: steps.key.outputs.available == 'true'
        id: checkpoints
        shell: bash
        env:
          TASK_ID: ${{ steps.site.outputs.task_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.parse, urllib.request

          key = os.environ["MANUS_API_KEY"]
          task_id = os.environ["TASK_ID"]
          url = "https://api.manus.ai/v2/website.listCheckpoints?" + urllib.parse.urlencode({"task_id": task_id})
          req = urllib.request.Request(url, headers={"x-manus-api-key": key})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          if not data.get("ok"):
              raise SystemExit(f"website.listCheckpoints failed: {data}")

          cps = data.get("data", [])
          latest = cps[0] if cps else {}
          print("published_version=" + str(data.get("published_version_id") or ""))
          print("latest_version=" + str(latest.get("version_id") or ""))
          print("latest_message=" + str(latest.get("message") or "").replace("\n", " "))
          PY

      - name: Publish latest Manus checkpoint
        if: steps.key.outputs.available == 'true'
        id: publish
        shell: bash
        env:
          TASK_ID: ${{ steps.site.outputs.task_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request

          key = os.environ["MANUS_API_KEY"]
          task_id = os.environ["TASK_ID"]
          body = json.dumps({"task_id": task_id, "visibility": "public"}).encode()
          req = urllib.request.Request(
              "https://api.manus.ai/v2/website.publish",
              data=body,
              method="POST",
              headers={
                  "x-manus-api-key": key,
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          if not data.get("ok"):
              raise SystemExit(f"website.publish failed: {data}")

          print("website_id=" + data["website_id"])
          print("version_id=" + str(data.get("version_id") or ""))
          PY

      - name: Wait for Manus deployment
        if: steps.key.outputs.available == 'true'
        shell: bash
        env:
          WEBSITE_ID: ${{ steps.publish.outputs.website_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          key = os.environ["MANUS_API_KEY"]
          website_id = os.environ["WEBSITE_ID"]

          for attempt in range(60):
              url = "https://api.manus.ai/v2/website.status?" + urllib.parse.urlencode({"website_id": website_id})
              req = urllib.request.Request(url, headers={"x-manus-api-key": key})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)

              status = data.get("publish_status")
              print(f"attempt={attempt+1} status={status} version={data.get('version_id')} urls={data.get('site_urls')}")
              if status == "published":
                  break
              if status == "failed":
                  raise SystemExit(f"Manus deployment failed: {data}")
              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for Manus deployment")
          PY

      - name: Verify public FitPrime version
        if: steps.key.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          url = "https://fitprimehub-sfh8sqab.manus.space/"
          req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "FitPrimeDeployCheck/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
          versions = re.findall(r'checkpoint-screenshot\.png\?v=([0-9a-f]+)', html, re.I)
          print("Public checkpoint markers:", versions or "none found")
          PY
